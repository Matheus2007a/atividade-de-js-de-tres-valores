<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maior de Três Valores</title>
</head>
<body>

    <h1>Maior de Três Valores</h1>

    <script>
        function maiorDeTres(a, b, c) {
            return Math.max(a, b, c);
        }

        document.write("Maior: " + maiorDeTres(10, 25, 15) + "<br>");
        document.write("Maior: " + maiorDeTres(50, 30, 40) + "<br>");
        document.write("Maior: " + maiorDeTres(7, 12, 20) + "<br>");
        document.write("Maior: " + maiorDeTres(100, 80, 90) + "<br>");
    </script>

</body>
</html>
